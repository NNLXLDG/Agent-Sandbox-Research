[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memsecbench"
version = "2.0.0"
description = "MemSecBench — Agent Sandbox Security Evaluation Framework"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
sandbox-eval = "sandbox_eval.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sandbox_eval*", "evaluation*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
